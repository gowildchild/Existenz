name: Check Ingest Export Divide | Existenz
# This routine does everything what it should
# do on the Guthub of Existenz. This gives 
# confidence that the structure is not 
# tampered with, while kept at the standard of
# the science that it is built upon.  

on:
  push:
    branches: [ "main", "master", "develop" ]

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    
    steps:
    - name: Existenz - CHECKOUT Code Blueprint
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }} 

    - name: Existenz - INIT Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Step 3: Determine Operational Mode from the Lockfile
    - name: Existenz - INSTALL Dependencies
      run: pip install pyyaml cryptography

    - name: Existenz - Bootstrap INITialization
      id: pipeline_init
      run: |
        # 1. Execute your compiled pre-flight dependency audit and self-healing loop
        python master/struct/engineSigningCLI.py -stage init -override update -run wet -circle master

        # 2. Extract runtime execution state from repository lock tracking assets
        if [ -f "master/.existentialLock" ]; then
          MODE=$(head -n 1 master/.existentialLock | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          echo " [!] Active Lockfile => Override: $MODE"
        else
          MODE="manifest"
          echo " [!] System Available => $MODE"
        fi
        
        echo "RUN_MODE=$MODE" >> $GITHUB_ENV

    - name: Existenz - Bootstrap RECOVERY Routine
      id: conditional_push
      run: |
        # Configure local bot configurations
        git config --global user.name "Existenz Build Bot"
        git config --global user.email "bot@existenz.xsrv.net"
        
        # Stage all potentially self-healed paths dynamically (sign_integrity_config.json is strictly excluded)
        git add master/existentialCore.py \
                master/existentialCoreThreat.py \
                master/existentialCoreCheck.py \
                master/existentialSignatures.py \
                master/existentialCores.json \
                master/existentialSignatures.json \
                master/struct/module/cliStateManifest.py \
                master/struct/module/cliStateSign.py \
                master/struct/module/cliStateVerify.py \
                master/struct/module/cliStateBuild.py 2>/dev/null || true

        if ! git diff-index --quiet HEAD; then
          echo " [*] Auto-Repairing missing assets "
          BLUEPRINT_VERSION=$(python -c 'import json; print(json.load(open("master/struct/existentialCoreSchema.json")).get("existentialMeta", {}).get("CoreVersion", "v0.76.15+"))')
          git commit -m "Existenz v$BLUEPRINT_VERSION -> Bootstrap Auto-REPAIR"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }} || true
          git push origin ${{ github.head_ref || github.ref_name }}
        else
          echo " [*] No missing assets, no commit."
        fi

    - name: Existenz - manifest.json
      env:
        GITHUB_ACTIONS: 'true'
        SIGN_EXISTENZ_AUDIT_PRIVATE: ${{ secrets.SIGN_EXISTENZ_AUDIT_PRIVATE }}
        SIGN_EXISTENZ_AUDIT_PHRASE: ''
        SIGN_EXISTENZ_AUDIT_PUBLIC: ${{ vars.SIGN_EXISTENZ_AUDIT_PUBLIC }}
        SIGN_EXISTENZ_AUDIT_FINGERPRINT: ${{ vars.SIGN_EXISTENZ_AUDIT_FINGERPRINT }}
      run: |
        # 1. Pure bash condition evaluation to eliminate static yaml parsing warnings
        if [ "$RUN_MODE" = "locked" ]; then
          echo " [!]  Active lockfile -> SKIP  manifest."
          exit 0
        fi

        # 2. Resolve fallback tracking values natively through pure shell assignments
        ACTIVE_CIRCLE="${CIRCLE_TARGET:-all}"
        
        echo " [*] Creating forensic file list for $ACTIVE_CIRCLE"
        
        python master/struct/engineSigningCLI.py -stage manifest -circle "$ACTIVE_CIRCLE" -override update -run wet
        BLUEPRINT_VERSION=$(python -c 'import json; print(json.load(open("master/struct/existentialCoreSchema.json")).get("existentialMeta", {}).get("CoreVersion", "v0.76.15+"))')
        echo " [*] manifest.json created"

        # 5. Commit operational configuration parameters natively to git
        git config --global user.name "Existenz Platform Bot"
        git config --global user.email "32355099+gowildchild@users.noreply.github.com"
      
        git add manifest.json
        
        if git diff --staged --quiet; then
          echo " [*] No fresh manifest, no commit."
        else
          git commit -m "Existenz $BLUEPRINT_VERSION -> Cross-Language Builder"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }} || true
          git push origin ${{ github.head_ref || github.ref_name }}
        fi
    - name: Existenz - Asymetric Signing
      env:
        GITHUB_ACTIONS: 'true'
        SIGN_EXISTENZ_AUDIT_PRIVATE: ${{ secrets.SIGN_EXISTENZ_AUDIT_PRIVATE }}
        SIGN_EXISTENZ_AUDIT_PHRASE: ''
        SIGN_EXISTENZ_AUDIT_PUBLIC: ${{ vars.SIGN_EXISTENZ_AUDIT_PUBLIC }}
        SIGN_EXISTENZ_AUDIT_FINGERPRINT: ${{ vars.SIGN_EXISTENZ_AUDIT_FINGERPRINT }}
      run: |
        if [ "$RUN_MODE" = "locked" ]; then
          echo " [!] Active lockfile -> Skipping Signing."
          exit 0
        fi

        ACTIVE_CIRCLE="${CIRCLE_TARGET:-dist}"
        echo " [*] Key signing routine for: $ACTIVE_CIRCLE"
        
        # Clean, uniform command block invoking the simple unified 'sign' stage
        python master/struct/engineSigningCLI.py -stage sign -circle "$ACTIVE_CIRCLE" -override update -run wet
        
        BLUEPRINT_VERSION=$(python -c 'import json; print(json.load(open("master/struct/existentialCoreSchema.json")).get("existentialMeta", {}).get("CoreVersion", "v0.76.15+"))')
        
        git config --global user.name "Existenz Platform Bot"
        git config --global user.email "32355099+gowildchild@users.noreply.github.com"
        
        git add manifest.json
        if git diff --staged --quiet; then
          echo "[+] No signing updates."
        else
          git commit -m "Existenz $BLUEPRINT_VERSION -> Cryptographical Signatures"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }} || true
          git push origin ${{ github.head_ref || github.ref_name }}
        fi

    - name: Existenz - Asymmetric Multi-Signature Verification Phase
      run: |
        if [ "$RUN_MODE" = "locked" ]; then
          echo " [!] Active Lockfile => Skipping Verify."
          exit 0
        fi

        ACTIVE_CIRCLE="${CIRCLE_TARGET:-dist}"
        echo " [+] Multi-Signature Verification -> $ACTIVE_CIRCLE"
        
        python master/struct/engineSigningCLI.py -stage verify -circle "$ACTIVE_CIRCLE" -override update -run wet

    - name: Existenz - Master Multi-Signature Verification Phase
      run: |
        if [ "$RUN_MODE" = "locked" ]; then
          echo " [!] Repository Builder => LOCKED <= Skipping verify."
          exit 0
        fi

        ACTIVE_CIRCLE="${CIRCLE_TARGET:-master}"
        echo " [*] Multi-Signature Verification -> $ACTIVE_CIRCLE"
        python master/struct/engineSigningCLI.py -stage verify -circle "$ACTIVE_CIRCLE" -override update -run wet

    - name: Existenz - Master Integrity Phase
      run: |
        if [ "$RUN_MODE" = "locked" ]; then
          echo " [!] Active Lockfile => SKIP Integrity Phase"
          exit 0
        fi

        ACTIVE_CIRCLE="${CIRCLE_TARGET:-all}"
        echo " [*] Multi-Signature Verification -> $ACTIVE_CIRCLE"

        python master/struct/engineSigningCLI.py -stage integrity -circle "$ACTIVE_CIRCLE" -override update -run wet

    - name: Existenz - Master Veritas Phase
      run: |
        if [ "$RUN_MODE" = "locked" ]; then
          echo " [!] Active Lockfile => SKIP Veritas"
          exit 0
        fi

        ACTIVE_CIRCLE="${CIRCLE_TARGET:-all}"
        echo " [O] Multi-Signature Verification -> $ACTIVE_CIRCLE"
        
        python master/struct/engineSigningCLI.py -stage veritas -circle "$ACTIVE_CIRCLE" -override update -run wet



