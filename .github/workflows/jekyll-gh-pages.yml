# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Build job: Compiles your static assets and Jekyll layers
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout@v4.1.7
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      # Pinned to actions/configure-pages@v5.0.0
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c729986d8c03

      # Pinned to actions/jekyll-build-pages@v1.0.13
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@0ee77f61dc99fa410e303498877bc9922e964082
        with:
          source: ./
          destination: ./_site

      # Pinned to actions/upload-pages-artifact@v3.0.1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dee99625f381

  # 2. Deployment job: Standard modern secure deployment pass
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    # REQUIRED: Explicitly opens the secure pages pipeline without giving repo write access
    permissions:
      contents: read
      pages: write
      id-token: write
      
    steps:
      # Pinned to actions/deploy-pages@v4.0.5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
