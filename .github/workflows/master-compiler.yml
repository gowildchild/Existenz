name: Existenz Core Automated Matrix Compiler & Site Deployer

on:
  push:
    paths:
      - 'apps/master_existenz/**'
  workflow_dispatch:

permissions:
  contents: read      # Read-only configuration prevents the script from creating an upload loop
  pages: write        # Necessary permission to serve the website
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  compile-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository Base
        uses: actions/checkout@v4

      - name: Initialize Stable Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Reads your master file and compiles the structure locally in memory
      - name: Compile Cross-Platform Bitmask Target Libraries
        run: |
          cd apps/master_existenz
          python build_existenz.py

      # Packages your generated folder for the website simulator
      - name: Package and Upload Site Directory Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/master_existenz/generated_outputs'

  deploy-site:
    runs-on: ubuntu-latest
    needs: compile-matrix
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Production Artifact Live to Pages Server
        id: deployment
        uses: actions/deploy-pages@v4
