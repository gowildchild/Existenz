name: Existenz Core Automated Matrix Compiler & Site Deployer

on:
  push:
    paths:
      - 'apps/master_existenz/**'
  workflow_dispatch:

# Set security overrides to allow native web deployments
permissions:
  contents: write
  pages: write
  id-token: write

# Prevent concurrent page deployments from clashing
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # JOB 1: Compile files and commit them to the repository branch
  compile-matrix:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit-step.outputs.changes }}
    steps:
      - name: Checkout Source Repository Base
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Initialize Stable Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Cross-Platform Bitmask Target Libraries
        run: |
          cd apps/master_existenz
          python build_existenz.py

      - name: Synchronize and Commit Generated System Artifacts
        id: commit-step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps/master_existenz/generated_outputs/* || true
          
          if git diff --staged --quiet; then
            echo "No variations detected. State remains immutable."
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Automated build: Updated dynamic core profiles and templates"
            git push origin HEAD:${{ github.ref_name }}
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

  # JOB 2: Force release the folder directory straight to the web simulator
  deploy-site:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: compile-matrix
    # Only deploy if the previous step successfully updated your workspace
    if: always()
    steps:
      - name: Checkout Source Repository Base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # Pull the absolute latest state containing the new files

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v4

      - name: Package and Upload Site Directory Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point this path EXACTLY to where your website simulator expects assets!
          # If it needs everything, use '.', or target your app directory specifically:
          path: 'apps/master_existenz/generated_outputs'

      - name: Deploy Production Artifact Live to Pages Server
        id: deployment
        uses: actions/deploy-pages@v4
