name: Existenz Core Emergency JSON Defect Finder

on:
  push:
    paths:
      - 'apps/master_existenz/**'
  workflow_dispatch:

jobs:
  locate-defect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository Base
        uses: actions/checkout@v4

      - name: Execute Cloud Diagnostic Syntax Inspection
        run: |
          cd apps/master_existenz
          python -c '
          import json, os
          target = "existenzCoreMaster.json"
          if not os.path.exists(target):
              print(f"[-] Cannot find {target}"); exit(1)
          with open(target, "r", encoding="utf-8") as f:
              payload = f.read()
          try:
              json.loads(payload)
              print("[+] SUCCESS: The file is 100% syntactically perfect!")
          except json.JSONDecodeError as e:
              print("\n" + "!"*60 + "\n💥 CRITICAL JSON SYNTAX ERROR LOCATED!\n" + f"Reason: {e.msg}\nLine: {e.lineno}\nColumn: {e.colno}\n" + "!"*60)
              lines = payload.splitlines()
              start = max(0, e.lineno - 4)
              end = min(len(lines), e.lineno + 4)
              print("\n--- EXACT RAW CODE VISUALIZER ---")
              for i in range(start, end):
                  ln = i + 1
                  marker = ">>> " if ln == e.lineno else "    "
                  print(f"{marker}Line {ln:03d}: {lines[i]}")
              print("----------------------------------\n")
          '
