name: Existenz Core Automated Matrix Compiler

on:
  push:
    paths:
      - 'apps/master_existenz/**'
  workflow_dispatch:

jobs:
  compile-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Repository Base
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Initialize Stable Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🔍 INJECT THE AUTOMATED JSON LINTER HERE
      - name: Validate JSON Structure (Lint)
        run: |
          cd apps/master_existenz
          echo "Linting master specification file..."
          python -m json.tool existenzCoreMaster.json > /dev/null
          echo "[+] JSON validation successful. No syntax errors found."

      - name: Compile Cross-Platform Bitmask Target Libraries
        run: |
          cd apps/master_existenz
          python build_existenz.py

      - name: Synchronize and Commit Generated System Artifacts
        run: |
          # Use the official, validated GitHub automation bot identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps/master_existenz/generated_outputs/* || true
          
          if git diff --staged --quiet; then
            echo "No variations detected within register maps. Structural state remains immutable."
          else
            git commit -m "Automated build: Updated dynamic core profiles and templates"
            git push origin HEAD:${{ github.ref_name }}
          fi
