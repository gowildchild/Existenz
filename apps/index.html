 function initialize3DOrbMeshCoordinates() {
  spherePoints3D = [];
  const totalNodes = APP_POOL.length;
  const goldenRatio = (1 + Math.sqrt(5)) / 2;
  
  for (let i = 0; i < totalNodes; i++) {
   const theta = 2 * Math.PI * i / goldenRatio;
   const phi = Math.acos(1 - 2 * (i + 0.5) / totalNodes);
   spherePoints3D.push({
    x: Math.cos(theta) * Math.sin(phi), y: Math.sin(theta) * Math.sin(phi), z: Math.cos(phi), app: APP_POOL[i]
   });
  }
 }

 function initializeStaticBlueprintLayout() {
  // Static background code lines populated into array loop
  for (let i = 0; i < 45; i++) {

   );
  }
 }

 function rotate3DNodePoint(point, ax, ay) {
  let cosX = Math.cos(ax), sinX = Math.sin(ax);
  let y1 = point.y * cosX - point.z * sinX; let z1 = point.y * sinX + point.z * cosX;
  let cosY = Math.cos(ay), sinY = Math.sin(ay);
  let x2 = point.x * cosY + z1 * sinY; let z2 = -point.x * sinY + z1 * cosY;
  point.x = x2; point.y = y1; point.z = z2;
 }

 function renderBackgroundFadersAndBlueprints(timestamp) {
  if (!bigWordState.lastTriggerTime) bigWordState.lastTriggerTime = timestamp;
  if (timestamp - bigWordState.lastTriggerTime > bigWordState.nextTriggerDelay) {
   bigWordState.text = INTERMITTENT_BIG_WORDS[Math.floor(Math.random() * INTERMITTENT_BIG_WORDS.length)];
   bigWordState.targetOpacity = 0.22; bigWordState.opacity = 0;
   bigWordState.lastTriggerTime = timestamp;
   bigWordState.nextTriggerDelay = 12000 + Math.random() * 23000; 
   bigWordState.posx = 0.15 + Math.random() * 0.7;
   bigWordState.posy = 0.15 + Math.random() * 0.7;
  }
  if (bigWordState.opacity < bigWordState.targetOpacity) {
   bigWordState.opacity += bigWordState.fadeSpeed;
   if (bigWordState.opacity >= bigWordState.targetOpacity) setTimeout(() => { bigWordState.targetOpacity = 0; }, 2500);
  } else if (bigWordState.opacity > bigWordState.targetOpacity) {
   bigWordState.opacity -= bigWordState.fadeSpeed;
  }
  if (bigWordState.opacity > 0) {
   ctx.save(); ctx.fillStyle = `rgba(255, 255, 255, ${bigWordState.opacity})`; ctx.font = "900 8rem monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
   ctx.fillText(bigWordState.text, canvas.width * bigWordState.posx, canvas.height * bigWordState.posy); ctx.restore();

  ctx.save();

  ctx.font = "11px monospace";

  vintageMonitorScrollOffsetY -= 0.25; 
  if (Math.abs(vintageMonitorScrollOffsetY) >= 18) {
   vintageMonitorScrollOffsetY = 0;
   // Shift lines array upward dynamically
   const firstLine = asynchronousBlueprintLines.shift();
   asynchronousBlueprintLines.push(firstLine);

  for (let i = 0; i < asynchronousBlueprintLines.length; i++) {
   // Fill rows from edge to edge all across the screen background
   const textLine = asynchronousBlueprintLines[i];
   ctx.fillText(textLine, 15, 25 + (i * 18) + vintageMonitorScrollOffsetY);
   ctx.fillText(textLine, canvas.width * 0.5, 25 + (i * 18) + vintageMonitorScrollOffsetY);
  }
  ctx.restore();

  nodePositions = [];
  spherePoints3D.forEach(pt => rotate3DNodePoint(pt, angleX, angleY));

  ctx.save();
  ctx.strokeStyle = "#ff00aa"; 
  
  // If timer is suspended (human present), use a stable, calm line.
  // If nobody is present (idle), create the rapid electrical flickering crackle loop.

  ctx.lineWidth = 1.2 + (electricSurge * 1.8); 
  ctx.shadowBlur = 10 + (electricSurge * 12); 
  ctx.shadowColor = "#ff00aa";
  ctx.globalAlpha = 0.8 + (electricSurge * 0.2);

  ctx.beginPath();
  for (let i = 0; i < spherePoints3D.length; i++) {
   for (let j = i + 1; j < spherePoints3D.length; j++) {
    const p1 = spherePoints3D[i], p2 = spherePoints3D[j];
    const depthScale1 = visualPerspectiveFocalDepth / (visualPerspectiveFocalDepth - p1.z);
    const depthScale2 = visualPerspectiveFocalDepth / (visualPerspectiveFocalDepth - p2.z);
    ctx.moveTo(p1.x * orbScaleRadius * depthScale1 + centerX, p1.y * orbScaleRadius * depthScale1 + centerY);
    ctx.lineTo(p2.x * orbScaleRadius * depthScale2 + centerX, p2.y * orbScaleRadius * depthScale2 + centerY);
   }
  }
  ctx.stroke();
  ctx.restore(); 

  spherePoints3D.forEach((point) => {
   const depthPerspective = visualPerspectiveFocalDepth / (visualPerspectiveFocalDepth - point.z);
   const drawX = point.x * orbScaleRadius * depthPerspective + centerX;
   const drawY = point.y * orbScaleRadius * depthPerspective + centerY;
   const targetNodeRadius = 6 * depthPerspective;

   nodePositions.push({ x: drawX, y: drawY, radius: targetNodeRadius + 12, path: point.app.path });

   ctx.save();
   ctx.fillStyle = point.app.name === "Plato Fields" ? "var(--green)" : "var(--pink)";
   ctx.shadowBlur = point.z > 0 ? 10 : 0;
   ctx.shadowColor = ctx.fillStyle;
   
   ctx.beginPath();
   ctx.arc(drawX, drawY, targetNodeRadius, 0, Math.PI * 2);
   ctx.fill();

   if (point.z > -0.2) {
    ctx.fillStyle = `rgba(0, 240, 255, ${Math.max(0.2, (point.z + 1) / 2)})`;
    ctx.font = `bold ${Math.floor(14 * depthPerspective)}px monospace`; 
    ctx.fillText(`[${point.app.name.toUpperCase()}]`, drawX + targetNodeRadius + 8, drawY + 4);
   }
  });

  requestAnimationFrame(executeMatrixRenderLoop);

   }
  });

  requestAnimationFrame(executeMatrixRenderLoop);
 } 
 
 function adaptCanvasLimits() {
  const container = document.getElementById("canvas-viewport-container");
  if (canvas && container) {
   canvas.width = container.clientWidth; canvas.height = container.clientHeight;
  }
 }

 function triggerTerminalJump(targetPath) {
  clearInterval(timerInterval); clearInterval(textInterval);
  document.body.classList.add('alarm-active');
  const finalPath = targetPath || APP_POOL[Math.floor(Math.random() * APP_POOL.length)].path;
  window.location.href = finalPath;
 }

 function freezeCounterMechanism() {
  if (isTimerSuspended || loadingOverlayActive) return;
  isTimerSuspended = true; 
  clearInterval(timerInterval);
  
  const statusDisplay = document.getElementById("countdown-status-node");
  if (statusDisplay) {
   statusDisplay.innerText = "y o u   g o t   p r e s e n c e  h e r e  &  n o w !";
   statusDisplay.style.color = "var(--green)";
  }
 }

 function initPortalEngine() {
  buildHtmlNavigationBarUI();
  initialize3DOrbMeshCoordinates();
  initializeStaticBlueprintLayout();
  
  canvas = document.getElementById("matrix-vis");
  if (canvas) {
   ctx = canvas.getContext("2d"); adaptCanvasLimits();
   requestAnimationFrame(executeMatrixRenderLoop);

  canvas.addEventListener("click", (event) => {
    if (loadingOverlayActive) return;
    const rect = canvas.getBoundingClientRect();
    const mX = event.clientX - rect.left, mY = event.clientY - rect.top;
    
    for (let node of nodePositions) {
     if (Math.hypot(mX - node.x, mY - node.y) <= node.radius) {
      triggerTerminalJump(node.path); break;
     }
    }
   });
   
  // Update mouse position coordinates continuously on canvas movement
  canvas.addEventListener('mousemove', (event) => {
   const rect = canvas.getBoundingClientRect();
   mouseX = event.clientX - rect.left;
   mouseY = event.clientY - rect.top;
   
   // Keep firing the timer freeze function natively
   freezeCounterMechanism();
  });

  }

  //window.addEventListener('mousemove', freezeCounterMechanism);
  canvas.addEventListener('mousemove', (event) => {
   const rect = canvas.getBoundingClientRect();
   mouseX = event.clientX - rect.left;
   mouseY = event.clientY - rect.top;
   freezeCounterMechanism();
  });
  const loaderText = document.querySelector('.loading-text');
  
  textInterval = setInterval(() => {
   if (loaderText && textCycleIndex < DRAMATIC_WORDS.length) {
    loaderText.innerText = DRAMATIC_WORDS[textCycleIndex]; textCycleIndex++;
   } else {
    clearInterval(textInterval); loadingOverlayActive = false;
    const loader = document.getElementById('loading-universe');
    if (loader) {
     loader.style.opacity = '0'; setTimeout(() => { loader.style.visibility = 'hidden'; }, 2000);
    }
    startIdleCountdownEngine();
   }
  }, 1200);

  function startIdleCountdownEngine() {
   const statusDisplay = document.getElementById("countdown-status-node");
   timerInterval = setInterval(() => {
    if (isTimerSuspended) return;
    countdownTime--;
    if (statusDisplay) statusDisplay.innerText = `[ A  U  T  O   -   R E D I R E C T  TIMELINE IN: ${countdownTime}s]`;
    if (countdownTime <= 0) triggerTerminalJump();
   }, 1000);
  }
 }

 window.addEventListener("resize", adaptCanvasLimits);
 document.addEventListener("DOMContentLoaded", initPortalEngine);
</script>
