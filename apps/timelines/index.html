<body>

    <!-- Left Control Panel -->
    <div id="sidebar">

        <div>
            <label for="sim-select" style="font-size: 11px; color: #718096; display:block; margin-bottom: 5px;">Spacetime Era Vector:</label>
            <select id="sim-select" onchange="changeSimulation()">

    <!-- Center Coordinate Field -->

    <!-- Right Panels -->

            <p id="no-selection" style="color: #4a5568; font-size: 11px; margin: 0;">Isolate an entity on the grid to filter and reduce telemetry chatter.</p>

                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size: 14px; font-weight: bold; color: #63b3ed;" id="ins-name">Individual #--</div>
                    <button class="btn" style="padding:2px 6px; font-size:10px; background:#4a5568;" onclick="clearSelection()">Clear Lock</button>
                </div>
                <div style="font-size: 11px; color: #718096; margin: 4px 0 8px 0;">Lineage: <span id="ins-family" style="color:#9f7aea;">Alpha</span> | Age: <span id="ins-age" style="color:#ecc94b;">0</span></div>
                <div style="margin-bottom: 10px; font-size: 12px; color: #cbd5e0;">Coordinates: <span id="ins-coords" style="color: #ecc94b;">X:0, Y:0, Z:0</span></div>

                <span id="log-filter-status" style="font-size:10px; color:#4a5568; background:#121620; padding:2px 6px; border-radius:3px;">FILTER: GLOBAL</span>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    let isPlaying = false;
    let selectedPersonIndex = -1; 
    let showSpirals = false;
    let currentSimType = 'tribal';
    let simulationTick = 0;
    let existenzThreatLevel = 0;
    let currentPopulationScale = 100; 
    
    const families = ["Alpha Lineage", "Beta Cluster", "Gamma Node", "Delta Branch", "Epsilon Matrix"];
    let people = [];

    const pillarNames = [
        { name: "EXISTENCE (Bit 1)", bit: 1 },
        { name: "AUTONOMY (Bit 2)", bit: 2 },
        { name: "INTEGRITY (Bit 4)", bit: 4 },
        { name: "PSYCHOLOGY (Bit 8)", bit: 8 },
        { name: "PHYSICAL (Bit 16)", bit: 16 },
        { name: "DISABILITY (Bit 32)", bit: 32 },
        { name: "DEVELOPMENT (Bit 64)", bit: 64 }
    ];

    function initPopulation() {
        people = [];
        let allocatedArraySize = currentPopulationScale > 1000 ? 500 : currentPopulationScale;

        for (let i = 0; i < allocatedArraySize; i++) {
            let assignedAge = Math.floor(Math.random() * 80);
            let familyId = Math.floor(Math.random() * families.length);
            people.push({
                id: i + 1,
                age: assignedAge,
                family: families[familyId],
                familySeed: familyId * 1.45, 
                individualTheta: Math.random() * Math.PI * 2, 
                bitmask: 0,
                lastBitmask: 0
            });
        }
    }
    
    function calculatePillars(person, age, type) {
        let bitmask = 0;
        bitmask |= 1;   // EXISTENCE
        bitmask |= 32;  // DISABILITY (The permanent universal inclusive floor)

        let lifeExpectancy = 80; 
        if (type === 'tribal')     lifeExpectancy = 35;
        if (type === 'antiquity')  lifeExpectancy = 40;
        if (type === 'feudal')     lifeExpectancy = 30;
        if (type === 'industrial') lifeExpectancy = 45;
        if (type === 'rights')     lifeExpectancy = 65;

        if (age >= lifeExpectancy) {
            return 0; 
        }

        bitmask |= 16;  // PHYSICAL
        bitmask |= 256; // PRESENCE

        switch(type) {
            case 'tribal':
                bitmask |= 2; 
                if (age >= 10) bitmask |= 4;  
                if (age >= 4)  bitmask |= 8;  
                if (age >= 8)  bitmask |= 64; 
                break;

            case 'antiquity':
                bitmask |= 2; 
                bitmask |= 4; 
                if (age >= 12) bitmask |= 8;  
                if (age >= 6)  bitmask |= 64; 
                break;

            case 'feudal':
                if (person.id % 8 === 0) bitmask |= 2 | 128; 
                if (age >= 14) bitmask |= 4;  
                if (age >= 10) bitmask |= 64; 
                break;

            case 'enlighten':
                if (age >= 15) bitmask |= 2;  
                bitmask |= 4;                 
                if (age >= 10) bitmask |= 8;  
                if (age >= 5)  bitmask |= 64; 
                break;

            case 'industrial':
                if (age >= 18) bitmask |= 2;   
                if (person.id % 2 === 0) bitmask |= 4; 
                if (age < 12 || age > 48) bitmask |= 8; 
                if (age >= 12) bitmask |= 64;  
                if (age >= 35) bitmask |= 128; 
                break;

            case 'rights':
                bitmask |= 2 | 4 | 64;         
                if (age >= 3)  bitmask |= 8;   
                if (age >= 28) bitmask |= 128; 
                bitmask |= (1 << 20) | (1 << 24); // SHIELD_HUMAN_RIGHTS & SHIELD_BASIC_RIGHTS
                break;

            case 'pre-surveil':
                bitmask |= 2 | 4 | 64;         
                if (age >= 5)  bitmask |= 8;   
                if (age >= 22) bitmask |= 128; 
                break;

            case 'early-data':
                bitmask |= 2 | 4 | 64 | 128;   
                if (age < 12 || age > 45) bitmask |= 8;              
                break;

            case 'modern':
                bitmask |= 2 | 64 | 128;       
                if (age < 11 || age > 55) bitmask |= 8;              
                if (person.id % 3 !== 0)  bitmask |= 4;              
                break;

            case 'crisis':
                bitmask |= 128; 
                if (age < 25 || age > 60) {
                    bitmask |= 2 | 4 | 8 | 64;
                } else {
                    bitmask |= 2; 
                    if (person.id % 5 === 0) bitmask |= 4; 
                }
                break;
        }
        return bitmask;
    }
    function processLifecycle() {
        simulationTick++;
        let brokenPillarsCount = 0;
        let totalCheckedPillars = people.length * 7; 
        let victimCount = 0;
        let bitFailureCounts = [0, 0, 0, 0, 0, 0, 0, 0, 0]; 
        
        const bitBlueprints = [
            { name: "EXISTENCE (1)",    count: 0, bit: 1 },
            { name: "AUTONOMY (2)",     count: 0, bit: 2 },
            { name: "INTEGRITY (4)",    count: 0, bit: 4 },
            { name: "PSYCHOLOGY (8)",   count: 0, bit: 8 },
            { name: "PHYSICAL (16)",    count: 0, bit: 16 },
            { name: "DISABILITY (32)",  count: 0, bit: 32 },
            { name: "DEVELOPMENT (64)", count: 0, bit: 64 },
            { name: "PROPERTY (128)",   count: 0, bit: 128 },
            { name: "PRESENCE (256)",   count: 0, bit: 256 }
        ];

        people.forEach((person) => {
            person.bitmask = calculatePillars(person, person.age, currentSimType);
        });

        people.forEach((person) => {
            person.lastBitmask = person.bitmask;
            
            if (person.bitmask === 0) {
                person.age = 0;
                person.individualTheta = Math.random() * Math.PI * 2;
                person.bitmask = calculatePillars(person, 0, currentSimType);
                pushLog(`Generation Cycle: Unit #${person.id} born into ${person.family}.`, 'log-birth', person.id, person.family);
                return;
            }

            let activeThreat = 0;
            if (currentSimType === 'feudal')       activeThreat |= 2 | 128; 
            if (currentSimType === 'industrial')   activeThreat |= 8 | 64;  
            if (currentSimType === 'crisis')       activeThreat |= 2 | 4 | 8 | 128; 

            if (person.bitmask & (1 << 20)) activeThreat &= ~4;   
            if (person.bitmask & (1 << 24)) activeThreat &= ~2;   
            if (person.bitmask & (1 << 26)) activeThreat &= ~128; 
            if (person.bitmask & (1 << 30)) activeThreat &= ~8;   

            let coreDamage = activeThreat; 
            let unshieldedStressCount = 0;
            for (let b = 0; b <= 7; b++) {
                if (coreDamage & (1 << b)) unshieldedStressCount++;
            }
            
            let lifecycleVelocity = 0.5 + (unshieldedStressCount * 0.5);
            person.age += lifecycleVelocity;

            let maxNaturalAge = 80;
            if (person.age >= maxNaturalAge) {
                person.bitmask = 0; 
                return;
            }

            person.bitmask = person.bitmask & ~coreDamage;

            if (person.bitmask !== person.lastBitmask && person.lastBitmask !== 0) {
                if (currentSimType === 'crisis' && person.age >= 25 && person.age <= 31 && !(person.bitmask & 4)) {
                    pushLog(`!! CRITICAL SEVERANCE !! Unit #${person.id} hit Age 30. Integrity stripped.`, 'log-threat', person.id, person.family);
                } else {
                    pushLog(`Unit #${person.id} bit-shift recorded across spacetime.`, 'log-shift', person.id, person.family);
                }
            }

            let individualIsVictim = false;
            bitBlueprints.forEach((blueprint) => {
                if (!(person.bitmask & blueprint.bit)) {
                    blueprint.count++;
                    if (blueprint.bit !== 32) brokenPillarsCount++; 
                    individualIsVictim = true;
                }
            });
            if (individualIsVictim) victimCount++;
        });

        existenzThreatLevel = Math.round((brokenPillarsCount / totalCheckedPillars) * 100);
        document.getElementById('threat-pct').innerText = `${existenzThreatLevel}%`;
        document.getElementById('threat-bar').style.width = `${existenzThreatLevel}%`;
        document.getElementById('threat-bar').style.backgroundColor = existenzThreatLevel > 35 ? '#e53e3e' : (existenzThreatLevel > 15 ? '#ecc94b' : '#48bb78');

        if (document.getElementById('victim-count')) {
            document.getElementById('victim-count').innerText = `${victimCount} / ${people.length}`;
        }

        let activeStressVectors = bitBlueprints.filter(item => item.bit !== 32);
        activeStressVectors.sort((a, b) => b.count - a.count);
        let topFiveVectors = activeStressVectors.slice(0, 5);

        const vectorsContainer = document.getElementById('top-vectors-list');
        if (vectorsContainer) {
            vectorsContainer.innerHTML = '';
            topFiveVectors.forEach((vector, rank) => {
                const vectorRow = document.createElement('div');
                vectorRow.style.display = 'flex';
                vectorRow.style.justifyContent = 'space-between';
                vectorRow.style.padding = '2px 4px';
                if (vector.count > 0) {
                    vectorRow.style.color = rank === 0 ? '#fc8181' : (rank < 3 ? '#f6ad55' : '#ecc94b');
                } else {
                    vectorRow.style.color = '#4a5568';
                }
                vectorRow.innerHTML = `<span>${rank + 1}. ${vector.name}</span><span style="font-weight:bold;">${vector.count}</span>`;
                vectorsContainer.appendChild(vectorRow);
            });
        }
    }

    function getXYZ(person) {
        let mask = person.bitmask;
        let x = 0;
        let y = 0;
        let z = 0;

        // X-Axis Identity & Assets
        if (mask & 1)   x += 5;   
        if (mask & 16)  x += 20;  
        if (mask & 128) x += 40;  

        // Y-Axis Cognitive/Moral Sovereignty
        if (mask & 2)   y += 5;   
        if (mask & 4)   y += 10;  
        if (mask & 8)   y += 15;  

        // Z-Axis Evolutionary Level of Being
        if (mask & 32)  z += 15;  
        if (mask & 64)  z += 30;  
        if (mask & 256) z += 60;  

        return { x: x, y: y, z: z };
    }

    function project(x, y, z, personAge, personBitmask) {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 130;
        const matrixScaleXY = 3.6; 
        const matrixScaleZ = 4.2; 

        let currentAge = personAge || 0;
        let currentMask = personBitmask || 0;

        const goldenRatio = 1.61803398875;
        let spiralTheta = (currentAge * 0.065);
        let internalMoralCurvature = (currentMask & 4 && currentMask & 8) ? 1.0 : 0.65;
        
        // Time naturally curves space outward continuously, completely dissolving the concentric walls
        let spaceWarpRadius = Math.log(currentAge + 1) * goldenRatio * 18.0 * internalMoralCurvature;
        
        let scaleFactor = (currentAge / 80.0) + 1.0;
        let curvedX = (x * scaleFactor) + (spaceWarpRadius * Math.cos(spiralTheta));
        let curvedY = (y * scaleFactor) + (spaceWarpRadius * Math.sin(spiralTheta));
        let curvedZ = z + (currentAge * 3.5 * internalMoralCurvature); // Continuous vertical lifecycle progression

        let isoX = centerX + (curvedX - curvedY) * Math.cos(0.52) * matrixScaleXY;
        let isoY = centerY + (curvedX + curvedY) * Math.sin(0.52) * matrixScaleXY - (curvedZ * matrixScaleZ);
        
        return { x: isoX, y: isoY };
    }

    function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#141b26';
        ctx.lineWidth = 1;
        
        let origin = project(0, 0, 0);
        let xAxis  = project(180, 0, 0);
        let yAxis  = project(0, 40, 0);
        let zAxis  = project(0, 0, 240);
        
        ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(xAxis.x, xAxis.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(yAxis.x, yAxis.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(zAxis.x, zAxis.y); ctx.stroke();
        
        ctx.strokeStyle = '#0a0e17';
        for (let r = 20; r <= 160; r += 35) {
            ctx.beginPath();
            ctx.arc(origin.x, origin.y - (r * 0.5), r * 1.5, 0, Math.PI * 2);
            ctx.stroke();
        }

        if (showSpirals) {
            ctx.lineWidth = 0.75;
            families.forEach((familyName, fId) => {
                let familySeed = fId * 1.45;
                ctx.strokeStyle = fId === 1 ? 'rgba(159, 122, 234, 0.25)' : 'rgba(49, 130, 206, 0.08)';
                ctx.beginPath();

                for (let testAge = 0; testAge <= 80; testAge += 1) {
                    let testMask = 1 | 16 | 32 | 2 | 4 | 8 | 64; 
                    if (currentSimType === 'crisis' && testAge >= 25 && testAge <= 60) {
                        testMask = 1 | 16 | 32 | 2; 
                    }

                    // FIXED: Calls the structural tracking function using a mock object to trace pure lineage lines
                    let coords = getXYZ({ age: testAge, bitmask: testMask, individualTheta: 0, familySeed: familySeed });
                    let pt = project(coords.x, coords.y, coords.z, testAge, testMask);

                    if (testAge === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();
            });
        }
    }
    function updateSimulation() {
        drawGrid();
        
        // --- MACRO SCALING: SMOOTH AGGREGATE FLOW MAPPING (10k - 1M) ---
        if (currentPopulationScale >= 10000) {
            ctx.lineWidth = 1;
            families.forEach((familyName, fId) => {
                let familySeed = fId * 1.45;
                ctx.strokeStyle = currentSimType === 'crisis' ? 'rgba(229, 62, 62, 0.015)' : (currentSimType === 'antiquity' ? 'rgba(72, 187, 120, 0.025)' : 'rgba(49, 130, 206, 0.02)');
                let densityLinesCount = currentPopulationScale === 10000 ? 50 : 180; 

                for (let j = 0; j < densityLinesCount; j++) {
                    ctx.beginPath();
                    let customThetaOffset = (j * (Math.PI * 2 / densityLinesCount));

                    for (let testAge = 0; testAge <= 80; testAge += 2) {
                        let testMask = calculatePillars({ id: j }, testAge, currentSimType);
                        if (testMask === 0) continue; 

                        // FIXED: Uses the unified trajectory calculus to weave a seamless aggregate map
                        let coords = getXYZ({ age: testAge, bitmask: testMask, individualTheta: customThetaOffset, familySeed: familySeed });
                        let pt = project(coords.x, coords.y, coords.z, testAge, testMask);

                        if (testAge === 0) ctx.moveTo(pt.x, pt.y);
                        else ctx.lineTo(pt.x, pt.y);
                    }
                    ctx.stroke();
                }
            });
            return; 
        }


        // --- DISCRETE INDIVIDUAL MODE (SCALE 100 - 1,000 UNITS) ---
        let sortedPopulation = [...people].sort((a, b) => {
            let posA = getXYZ(a);
            let posB = getXYZ(b);
            return (posA.x + posA.y) - (posB.x + posB.y);
        });

        sortedPopulation.forEach((person) => {
            if (person.bitmask === 0) return; 
            
            let coords = getXYZ(person);
            let pt = project(coords.x, coords.y, coords.z, person.age, person.bitmask);
            let isTargeted = (selectedPersonIndex !== -1 && person.id === people[selectedPersonIndex].id);
            
            ctx.strokeStyle = isTargeted ? 'rgba(159, 122, 234, 0.25)' : 'rgba(49, 130, 206, 0.03)';
            ctx.lineWidth = 0.5;
            let originPt = project(0, 0, coords.z, person.age, person.bitmask);
            ctx.beginPath(); ctx.moveTo(originPt.x, originPt.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();

            if (isTargeted) {
                ctx.fillStyle = '#f6e05e';
                ctx.shadowColor = '#f6e05e';
                ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; 
                updateInspector(person, coords);
            } else {
                if (currentSimType === 'crisis' && person.age >= 25 && person.age <= 60) {
                    ctx.fillStyle = (person.bitmask & 4) ? '#fc8181' : '#e53e3e';
                } else if (currentSimType === 'diogenes' || currentSimType === 'antiquity') {
                    ctx.fillStyle = '#48bb78'; 
                } else if (currentSimType === 'modern') {
                    ctx.fillStyle = (person.bitmask & 8) ? '#4299e1' : '#ed8936'; 
                } else {
                    ctx.fillStyle = '#3182ce'; 
                }
                
                let radius = currentPopulationScale === 1000 ? 1.5 : 2.5 + (person.age * 0.05);
                ctx.beginPath(); ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2); ctx.fill();
            }
        });
    }

    function updateInspector(person, coords) {
        document.getElementById('no-selection').style.display = 'none';
        document.getElementById('inspector-content').style.display = 'block';
        document.getElementById('ins-name').innerText = `Individual #${person.id}`;
        document.getElementById('ins-family').innerText = person.family;
        document.getElementById('ins-age').innerText = Math.floor(person.age);
        document.getElementById('ins-coords').innerText = `X:${Math.round(coords.x)}, Y:${Math.round(coords.y)}, Z:${Math.round(coords.z)}`;
        
        const list = document.getElementById('pillars-list');
        list.innerHTML = '';
        
        pillarNames.forEach(p => {
            const isActive = (person.bitmask & p.bit) !== 0;
            const div = document.createElement('div');
            div.className = `pillar ${isActive ? 'active' : 'inactive'}`;
            div.innerHTML = `<span>${p.name}</span><span>${isActive ? 'INTACT' : 'STRIPPED'}</span>`;
            list.appendChild(div);
        });
    }
    canvas.addEventListener('click', (e) => {
        if (currentPopulationScale >= 10000) {
            pushLog("TELEMETRY LIMIT: Click selection deactivated inside dense macro vector fields.", "log-shift");
            return;
        }
        
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        
        let closestIndex = -1;
        let minDist = 99999;
        
        people.forEach((person, index) => {
            if (person.bitmask === 0) return;
            let coords = getXYZ(person);
            let pt = project(coords.x, coords.y, coords.z, person.age, person.bitmask);
            let dist = Math.hypot(pt.x - clickX, pt.y - clickY);
            if (dist < minDist) {
                minDist = dist;
                closestIndex = index;
            }
        });
        
        if (minDist < 30) { 
            selectedPersonIndex = closestIndex;
            let lockedPerson = people[selectedPersonIndex];
            document.getElementById('log-filter-status').innerText = `LOCK: ID #${lockedPerson.id} & LINEAGE`;
            document.getElementById('log-filter-status').style.color = '#9f7aea';
            pushLog(`TELEMETRY LOCK ENGAGED: Isolating data strings for Individual #${lockedPerson.id} and the ${lockedPerson.family}.`, 'log-lock');
            updateSimulation();
        }
    });

    function clearSelection() {
        selectedPersonIndex = -1;
        document.getElementById('no-selection').style.display = 'block';
        document.getElementById('inspector-content').style.display = 'none';
        document.getElementById('log-filter-status').innerText = `FILTER: GLOBAL`;
        document.getElementById('log-filter-status').style.color = '#4a5568';
        pushLog("TELEMETRY UNLOCKED: Global telemetry chatter stream restored.", "log-shift");
        updateSimulation();
    }

    function toggleSpiralField() {
        showSpirals = !showSpirals;
        const btn = document.getElementById('spiral-btn');
        if (showSpirals) {
            btn.classList.add('active-mode');
            btn.innerText = "Hide Majestic Spirals";
            pushLog("VISUALIZER MATRIX: Majestic structural Fibonacci rails projected onto grid.", "log-shift");
        } else {
            btn.classList.remove('active-mode');
            btn.innerText = "Show Majestic Spirals";
            pushLog("VISUALIZER MATRIX: Continuous geometric curves hidden.", "log-shift");
        }
        updateSimulation();
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('play-btn').innerText = isPlaying ? "Halt Spacetime Loop" : "Engage Spacetime Loop";
        if (isPlaying) executionLoop();
    }

    function changeSimulation() {
        currentSimType = document.getElementById('sim-select').value;
        let profileName = document.getElementById('sim-select').options[document.getElementById('sim-select').selectedIndex].text;
        pushLog(`EPOCH RESET: Rules shifted to [${profileName}].`, 'log-shift');
        clearSelection(); 
        updateSimulation();
    }

    function changePopulationScale() {
        currentPopulationScale = parseInt(document.getElementById('scale-select').value);
        pushLog(`SCALE INTERCEPT: Universe metrics recalibrated to [${currentPopulationScale.toLocaleString()}] units.`, 'log-shift');
        clearSelection(); 
        initPopulation(); 
        updateSimulation();
    }

    function executionLoop() {
        if (!isPlaying) return;
        processLifecycle();
        updateSimulation();
        setTimeout(() => { requestAnimationFrame(executionLoop); }, 70); 
    }

    function pushLog(text, type = '', entityId = null, entityFamily = null) {
        if (selectedPersonIndex !== -1) {
            let lockedPerson = people[selectedPersonIndex];
            if (entityId !== null && entityId !== lockedPerson.id && entityFamily !== lockedPerson.family) {
                return; 
            }
        }

        const stream = document.getElementById('log-stream');
        if (!stream) return;
        
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        
        let timestamp = new Date().toLocaleTimeString().split(' ');
        entry.innerHTML = `[${timestamp}] ${text}`;
        stream.appendChild(entry);
        
        stream.scrollTop = stream.scrollHeight;
        if (stream.children.length > 35) {
            stream.removeChild(stream.firstChild);
        }
    }
    
    
    window.addEventListener('load', () => {
        initPopulation();
        
        // Safely executes now that pushLog is fully defined in the global memory space
        pushLog("Existenz Space-Time Matrix online. 50 multiversal timelines activated.", "log-birth");
        
        updateSimulation();
    });
</script>
</body>
